name: Bouw APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installeer pakketten
        run: npm install

      - name: Kopieer de webcode naar de app
        run: npx cap sync android

      - name: Bouw de APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Hernoem de APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Start.apk

      - name: Publiceer als release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Start (build ${{ github.run_number }})
          files: Start.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: Start-apk
          path: Start.apk
